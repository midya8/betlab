name: BetLab checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m betlab demo > /tmp/demo.json && cmp /tmp/demo.json examples/demo.json
      - run: python examples/render_demo.py --check
      - run: python examples/render_starts.py --check
      - run: python examples/render_confidence.py --check
      - run: python -m betlab confidence-demo > /tmp/confidence-demo.json && cmp /tmp/confidence-demo.json examples/confidence-demo.json
      - run: python -m betlab starts-demo > /tmp/starts-demo.json && cmp /tmp/starts-demo.json examples/starts-demo.json
      - run: |
          python -m betlab replay examples/replay-input.json > /tmp/replay.json
          python -m betlab paired examples/paired-input.json > /tmp/paired.json
          python -m betlab tree examples/tree-input.json > /tmp/tree.json
          python -m betlab starts examples/starts-input.json > /tmp/starts.json
          python -m betlab starts-tree examples/starts-tree-input.json > /tmp/starts-tree.json
          python -m betlab mean examples/mean-input.json > /tmp/mean.json
          python -m betlab confidence examples/confidence-input.json > /tmp/confidence.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          for mode in demo starts-demo confidence-demo replay paired tree starts starts-tree mean confidence; do
            if [ "$mode" = demo ] || [ "$mode" = starts-demo ] || [ "$mode" = confidence-demo ]; then
              python -m betlab "$mode" > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m betlab "$mode") > /tmp/wheel-$mode.json
            else
              python -m betlab "$mode" "examples/$mode-input.json" > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m betlab "$mode" "$GITHUB_WORKSPACE/examples/$mode-input.json") > /tmp/wheel-$mode.json
            fi
            cmp /tmp/source-$mode.json /tmp/wheel-$mode.json
          done
