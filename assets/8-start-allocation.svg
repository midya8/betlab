<text x="42" y="628" font-size="21" font-weight="700">2 Exhaustive null-law audit, alpha = 1/4</text>
<text x="42" y="656" font-size="16" class="muted">Starts 1, 3, 5, 9 each receive 1/4; the round-9 budget stays reserved in both trees.</text>
<text x="52" y="700" font-size="16" font-weight="700">Null tree</text>
<text x="415" y="700" font-size="16" font-weight="700">P(ever &gt;= 4)</text>
<text x="645" y="700" font-size="16" font-weight="700">E(final wealth)</text>
<text x="855" y="700" font-size="16" font-weight="700">E(stopped wealth)</text>
<text x="52" y="743" font-size="17" >Fair signs, 8 rounds</text>
