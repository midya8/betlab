<text x="645" y="743" font-size="18" id="cell-fair_null-expected_final_wealth" data-value="1">1</text>
<text x="855" y="743" font-size="18" id="cell-fair_null-expected_stopped_wealth" data-value="1">1</text>
<text x="52" y="791" font-size="17" >P(+1)=1/3, 6 rounds</text>
<text x="415" y="791" font-size="18" id="cell-negative_drift_null-crossing_probability" data-value="17/729">17/729</text>
<text x="645" y="791" font-size="18" id="cell-negative_drift_null-expected_final_wealth" data-value="1261/2916">1261/2916</text>
<text x="855" y="791" font-size="18" id="cell-negative_drift_null-expected_stopped_wealth" data-value="683/1458">683/1458</text>
<text x="42" y="850" font-size="17" >The invalid free-refill control still crosses with probability 201/256 in the fair tree.</text>
<text x="42" y="882" font-size="17" >The planned mixture crosses with probability 5/32 &lt;= 1/4; no unbudgeted capital is added.</text>
<text x="42" y="930" font-size="17" >For start s: K(s,t)=1 before s, then multiply 1+b*D from s onward.</text>
<text x="42" y="960" font-size="17" >Fixed nonnegative start/bet weights sum to one, including the unstarted reserve.</text>
<text x="42" y="1000" font-size="15" class="muted">One prespecified conditional-mean-null test. Not a change-time estimate or a general power ranking.</text>
<text x="42" y="1028" font-size="15" class="muted">No adaptive/post-hoc starts, infinite-horizon restart service, ARL detector or model-selection correction.</text>
