<text x="850" y="748" font-size="18" id="cell-invalid_restart-expected_stopped_wealth" data-value="423/128">423/128</text>
<text x="42" y="810" font-size="17" >Restart comparator crosses with probability 201/256 &gt; 1/4. It injects new capital at ruin.</text>
<text x="42" y="842" font-size="16" class="muted">The node audit exposes negative conditional slack at reset histories. It is not an e-process.</text>
<text x="42" y="889" font-size="21" font-weight="700">3 Paired-score fixture: baseline 1/2, candidate 3/4, 32 rounds</text>
<text x="42" y="922" font-size="16" >At alpha 1/20: fixed-mixture crossing 19; past-only strategy crossing 17. Descriptive only.</text>
<text x="42" y="962" font-size="15" class="muted">Validity requires E[difference_t | past] &lt;= 0 under the null, bounded scores and a prespecified test.</text>
<text x="42" y="988" font-size="15" class="muted">No guarantee for marginal-mean-only nulls, post-hoc stream choice, model selection or repeated refills.</text>
