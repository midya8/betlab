<text x="42" y="58" font-size="26" font-weight="700">BetLab / evidence survives optional stopping, not free restarts</text>
<text x="42" y="86" font-size="16" class="muted">Exact rational betting for bounded paired model-score differences. No model benchmark.</text>
<text x="42" y="130" font-size="21" font-weight="700">1 A crossing can remain valid even when current wealth later falls</text>
<text x="42" y="157" font-size="15" class="muted">Eight +1 differences, then twelve -1. Vertical coordinate: log2(1 + wealth).</text>
