<text x="42" y="550" font-size="21" font-weight="700">2 Exhaustive fair-null tree: 256 paths, eight rounds, alpha = 1/4</text>
<text x="42" y="579" font-size="15" class="muted">At every history P(+1)=P(-1)=1/2. Valid processes start at one, without refills.</text>
<text x="52" y="622" font-size="16" font-weight="700">Process</text>
